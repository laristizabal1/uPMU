; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_f303k8]
platform = ststm32
board = nucleo_f303k8
framework = stm32cube
upload_protocol = stlink
; El F303K8 tiene 12 KB de SRAM; el script de OpenOCD supone 16 KB y, con binarios > ~8 KB, escribe
; fuera de la RAM (error en 0x20003008). Se limita el area de trabajo a 8 KB.
upload_flags =
    -c
    set WORKAREASIZE 0x2000
monitor_speed = 115200
extra_scripts = pre:fpu.py   ; FPU de hardware en compilacion y enlazado
build_unflags = -Os
build_flags =
    -O2                        ; velocidad (T4.4): -Os (por defecto) dejaba el estimador ~2x mas lento
    -D ARM_MATH_CM4
